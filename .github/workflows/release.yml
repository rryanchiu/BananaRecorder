name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Set release version in CI only
        run: node .github/scripts/release-version.mjs

      # The full build bundles FFmpeg; use a static LGPL build to keep the
      # license obligations simple. Pinned to the 8.1 release branch: the
      # rolling master build ships upstream regressions (it broke douyin
      # recording in v1.0.0 with strict option validation).
      - name: Bundle FFmpeg (LGPL static)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist -Force
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $exe = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the archive" }
          Copy-Item $exe.FullName src-tauri/binaries/ffmpeg.exe -Force

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-latest
    # Windows is the primary target: don't block a Windows release on the
    # unsigned macOS build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Set release version in CI only
        run: node .github/scripts/release-version.mjs

      - name: Bundle FFmpeg (macOS arm64)
        run: |
          curl -L --fail "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg-dist
          mkdir -p src-tauri/binaries
          cp ffmpeg-dist/ffmpeg src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg

      - name: Build app and dmg
        run: npm run tauri build -- --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: BananaRecorder ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
